[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "automemory"
version = "0.0.1"
description = "A passive capture engine for AI conversations — record engine + pluggable capture strategies."
requires-python = ">=3.9"
dependencies = []  # standard library only, by design (BUILD-SPEC §0)

[project.scripts]
automemory = "automemory.cli:main"

[tool.setuptools]
packages = ["automemory"]

[tool.setuptools.package-data]
automemory = ["prompts/*.md"]
